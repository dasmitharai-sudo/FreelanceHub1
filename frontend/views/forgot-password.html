<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="fh-card p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;">
            <i class="bi bi-key-fill"></i>
          </div>
          <h3 class="fw-bold mb-1">Forgot Password</h3>
          <p class="text-muted small">Enter your account email to receive a password reset token.</p>
        </div>

        <div class="alert alert-danger py-2 small" ng-if="errorMessage">
          <i class="bi bi-exclamation-triangle-fill me-1"></i> {{errorMessage}}
        </div>

        <div class="alert alert-success py-2 small" ng-if="successMessage">
          <i class="bi bi-check-circle-fill me-1"></i> {{successMessage}}
          <div class="mt-2 text-center" ng-if="demoResetToken">
            <a href="#!/reset-password/{{demoResetToken}}" class="btn btn-sm btn-success">Proceed to Reset Password Now</a>
          </div>
        </div>

        <form ng-submit="doForgotPassword()" ng-if="!demoResetToken">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" ng-model="forgotData.email" placeholder="name@example.com" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-fh w-100 py-2 mt-2" ng-disabled="isSubmitting">
            <span ng-if="!isSubmitting">Send Reset Token</span>
            <span ng-if="isSubmitting"><span class="spinner-border spinner-border-sm me-2"></span>Processing...</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <a href="#!/login" class="small fw-semibold text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
